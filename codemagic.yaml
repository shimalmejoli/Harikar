workflows:
  ios-release-workflow:
    name: Build & Submit iOS (Harikar)
    instance_type: mac_mini_m2
    max_build_duration: 60

    # Your Apple Developer Portal / App Store Connect API key in Codemagic
    # is named "Harikar" (Key ID LZ72XZ3TCQ). This provides auth for both
    # code signing and publishing.
    integrations:
      app_store_connect: Harikar

    environment:
      # Pinned to match local dev — font_awesome_flutter 10.9.1 doesn't
      # build on Flutter 3.44+ (IconData became final). Do NOT use 'stable'.
      flutter: 3.32.5
      # Pinned too: 'latest' rolls onto Xcode versions newer than this
      # Flutter release supports, which fails at the Runner build phase.
      xcode: 16.4
      cocoapods: default
      vars:
        BUNDLE_ID: "com.heamasoft.harikar"

    # Push a version tag (e.g. `git tag v1.0.5 && git push origin v1.0.5`)
    # to trigger a release build automatically.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      # Decouple the iOS build number from the Android versionCode in
      # pubspec. The numeric App Store app id is resolved from BUNDLE_ID
      # at build time, so there is no id to paste in by hand — and the
      # very first release (no app record / no builds yet) starts at 1.
      - name: Set iOS build number from App Store Connect
        script: |
          set -e
          APP_ID=$(app-store-connect apps list \
                     --bundle-id-identifier "$BUNDLE_ID" \
                     --json 2>/dev/null | jq -r '.[0].id // empty' || true)

          if [ -z "$APP_ID" ]; then
            echo "No App Store Connect record for $BUNDLE_ID yet — starting at build 1"
            NEW_BUILD=1
          else
            LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_ID" 2>/dev/null || echo "0")
            case "$LATEST" in
              ''|*[!0-9]*) LATEST=0 ;;
            esac
            NEW_BUILD=$((LATEST + 1))
            echo "App id $APP_ID — latest App Store build: $LATEST → using $NEW_BUILD"
          fi
          echo "IOS_BUILD_NUMBER=$NEW_BUILD" >> "$CM_ENV"

      - name: Regenerate iOS project and Pods
        script: |
          flutter clean
          flutter pub get
          rm -rf ios/Pods ios/Podfile.lock
          flutter build ios --no-codesign

      - name: Disable Bitcode
        script: |
          sed -i '' 's/ENABLE_BITCODE = YES;/ENABLE_BITCODE = NO;/g' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Set up keychain & fetch signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates

      - name: Build .ipa for release
        script: |
          flutter build ipa --release \
            --build-number="$IOS_BUILD_NUMBER"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Build + TestFlight only. Submission to App Store review is done
        # by hand from App Store Connect, so an incomplete listing (missing
        # screenshots, privacy answers) can't fail the pipeline. Flip to
        # true once the first release is approved and the listing is stable.
        submit_to_app_store: false
        # Only take effect when submit_to_app_store is true — re-enable
        # them together. AFTER_APPROVAL = goes live automatically once
        # Apple approves; MANUAL = you click "Release" yourself.
        # release_type: AFTER_APPROVAL
        # cancel_previous_submissions: true
      email:
        recipients:
          - heama.soft@gmail.com
