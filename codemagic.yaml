workflows:
  ios-release-workflow:
    name: Build & Submit iOS (Harikar)
    instance_type: mac_mini_m2
    max_build_duration: 60

    # Your Apple Developer Portal / App Store Connect API key in Codemagic
    # is named "Harikar" (Key ID LZ72XZ3TCQ). This provides auth for both
    # code signing and publishing.
    integrations:
      app_store_connect: Harikar

    environment:
      # Pinned to match local dev — font_awesome_flutter 10.9.1 doesn't
      # build on Flutter 3.44+ (IconData became final). Do NOT use 'stable'.
      flutter: 3.32.5
      # Pinned too: 'latest' rolls onto Xcode versions newer than this
      # Flutter release supports, which fails at the Runner build phase.
      xcode: 16.4
      cocoapods: default
      vars:
        BUNDLE_ID: "com.heamasoft.harikar"

    # Push a version tag (e.g. `git tag v1.0.5 && git push origin v1.0.5`)
    # to trigger a release build automatically.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      # iOS version + build number both come from App Store Connect, not
      # from pubspec: pubspec's version tracks the Play release (Android
      # versionCode), and App Store Connect only accepts a build whose
      # version string matches the version record it is attached to.
      #
      #   version string → the record currently open for editing
      #                    (PREPARE_FOR_SUBMISSION / REJECTED / etc.)
      #   build number   → highest build already uploaded, + 1
      #
      # Anything that can't be resolved falls back to pubspec's values,
      # so the build still runs rather than failing on a lookup.
      - name: Read iOS version and build number from App Store Connect
        script: |
          set -e
          APP_ID=$(app-store-connect apps list \
                     --bundle-id-identifier "$BUNDLE_ID" \
                     --json 2>/dev/null | jq -r '.[0].id // empty' || true)

          if [ -z "$APP_ID" ]; then
            echo "No App Store Connect record for $BUNDLE_ID — falling back to pubspec"
            exit 0
          fi
          echo "App Store Connect app id: $APP_ID"

          # --- build number -------------------------------------------------
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_ID" 2>/dev/null || echo "0")
          case "$LATEST" in
            ''|*[!0-9]*) LATEST=0 ;;
          esac
          NEW_BUILD=$((LATEST + 1))
          echo "latest uploaded build: $LATEST → using $NEW_BUILD"
          echo "IOS_BUILD_NUMBER=$NEW_BUILD" >> "$CM_ENV"

          # --- version string -----------------------------------------------
          # Prefer a version still open for editing; if every record is
          # already live, reuse the newest one so the upload is at least
          # rejected loudly instead of silently mismatching.
          VERSIONS=$(app-store-connect apps app-store-versions "$APP_ID" --json 2>/dev/null || echo '[]')
          IOS_VERSION=$(echo "$VERSIONS" | jq -r '
            [ .[] | select(.attributes.appStoreState
                | test("PREPARE_FOR_SUBMISSION|DEVELOPER_REJECTED|REJECTED|METADATA_REJECTED|WAITING_FOR_REVIEW|IN_REVIEW|PENDING_DEVELOPER_RELEASE")) ]
            | first | .attributes.versionString // empty')

          if [ -z "$IOS_VERSION" ]; then
            IOS_VERSION=$(echo "$VERSIONS" | jq -r '.[0].attributes.versionString // empty')
          fi

          if [ -n "$IOS_VERSION" ]; then
            echo "App Store Connect version record: $IOS_VERSION"
            echo "IOS_VERSION=$IOS_VERSION" >> "$CM_ENV"
          else
            echo "No version record found — falling back to the pubspec version"
          fi

      # Fetch (or create) the distribution certificate + App Store
      # provisioning profile, then point the Xcode project at them.
      # `use-profiles` is what switches Runner to manual signing and
      # writes the export options plist — without it the build fails
      # with "No profiles for 'com.heamasoft.harikar' were found".
      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      # Pods and the Podfile are generated by the Flutter tool during
      # this step — the repo carries neither, so there is nothing to
      # clean first on a fresh build machine.
      - name: Build .ipa for release
        script: |
          set -e
          # Empty vars mean the lookup found nothing, so the flag is left
          # off entirely and Flutter uses the pubspec value. Written as
          # `if` blocks, not `[ ... ] && ...` — a false test returns 1 and
          # `set -e` would abort the step on exactly the fallback path.
          ARGS=""
          if [ -n "$IOS_VERSION" ]; then
            ARGS="$ARGS --build-name=$IOS_VERSION"
          fi
          if [ -n "$IOS_BUILD_NUMBER" ]; then
            ARGS="$ARGS --build-number=$IOS_BUILD_NUMBER"
          fi
          echo "Building with:${ARGS:- pubspec version}"

          flutter build ipa --release $ARGS \
            --export-options-plist="$HOME/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Build + TestFlight only. Submission to App Store review is done
        # by hand from App Store Connect, so an incomplete listing (missing
        # screenshots, privacy answers) can't fail the pipeline. Flip to
        # true once the first release is approved and the listing is stable.
        submit_to_app_store: false
        # Only take effect when submit_to_app_store is true — re-enable
        # them together. AFTER_APPROVAL = goes live automatically once
        # Apple approves; MANUAL = you click "Release" yourself.
        # release_type: AFTER_APPROVAL
        # cancel_previous_submissions: true
      email:
        recipients:
          - heama.soft@gmail.com
