# Sized for this machine (7.7 GB RAM). The previous -Xmx8G -XX:MaxMetaspaceSize=4G
# asked for more than the box has: once the daemon grew past physical memory the
# build thrashed and died mid-write, leaving unreadable kotlin-dsl metadata.bin
# files ("Could not read workspace metadata"). Raise these only on a bigger box.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
